[workspace]
members = [
    "crates/core",
    "crates/tools",
    "crates/server",
    "crates/cli",
    "crates/mcp-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Web framework
axum = "0.7"

# CLI
clap = { version = "4", features = ["derive"] }

# Tooling
async-trait = "0.1"
thiserror = "2"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
regex = "1"
futures = "0.3"
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

# Workspace internal crates
trove-core = { path = "crates/core" }
trove-tools = { path = "crates/tools" }
trove-server = { path = "crates/server" }
